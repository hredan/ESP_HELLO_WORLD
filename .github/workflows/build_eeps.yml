on:
    workflow_call:
jobs:
    build_ESP8266:
        runs-on: ubuntu-latest
        env:
            SKETCH_NAME: ESP_HELLO_WORLD
            CORE: esp8266
            BOARD: d1_mini
        steps:
          - uses: actions/checkout@v4
          - uses: hredan/eep-build-action@main
            with:
              sketch-name: ${{env.SKETCH_NAME}}
              core: ${{env.CORE}}
              board: ${{env.BOARD}}
              libs: "Dictionary"
    build_ESP32:
        runs-on: ubuntu-latest
        env:
            SKETCH_NAME: ESP_HELLO_WORLD 
            CORE: esp32
            BOARD: d1_mini32
        steps:
          - uses: actions/checkout@v4
          - uses: hredan/eep-build-action@main
            with:
              sketch-name: ${{env.SKETCH_NAME}}
              core: ${{env.CORE}}
              board: ${{env.BOARD}}
              libs: "Dictionary"